<style>
  /* Eureka 0.9.3 ships a pre-generated default CSS resource, so override its
     font variable while the `wayne` style prevents default Google Font loads. */
  :root {
    --fonts-eureka: system-ui, -apple-system, Lora, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, serif;
  }
</style>
{{- $blogCSS := resources.Get "css/blog.css" | minify | fingerprint "sha384" }}
<link rel="stylesheet" href="{{ $blogCSS.Permalink }}" integrity="{{ $blogCSS.Data.Integrity }}">
