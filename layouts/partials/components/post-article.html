<article class="prose" data-pagefind-body>
  <h1 class="mb-4" data-pagefind-meta="title" data-pagefind-weight="10">{{ .Title }}</h1>

  {{ partial "components/post-metadata" . }}

  {{ $featured := partial "utils/get-featured" . }}
  {{ with $featured }}
    {{ . }}
  {{ end }}

  {{ .Content }}
</article>
